<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121110" />
    <!-- Hero: preload the clinic-tour poster the homepage will show, so its first frame paints before
         the app bundle. Same choice as pickScrubSource (src/components/hero/useScrubVideo.js): the 1920
         poster above 1400 device pixels across, else 1280. Runs before the stylesheets so it never waits. -->
    <script>
      (function () {
        if (/^\/(about|treatments|pricing|prescription-skincare|skincare)(\/|$)/.test(location.pathname)) return;
        var c = navigator.connection;
        var constrained = c && (c.saveData || /(^|-)2g$/.test(c.effectiveType || ''));
        var large = !constrained && window.innerWidth * Math.min(window.devicePixelRatio || 1, 2) > 1400;
        var link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'image';
        link.href = '/assets/videos/clinic_tour_poster-' + (large ? '1920' : '1280') + '.webp';
        link.setAttribute('fetchpriority', 'high');
        document.head.appendChild(link);
      })();
    </script>
    <title>Allure Passions UK | Award-Winning Advanced Aesthetic Clinic Fitzrovia</title>
    <meta name="description" content="Allure Passions UK Aesthetic Clinic - Winner of Best Advanced Skin & Body Aesthetics Clinic 2026 London. JCCP Registered Practice. 76 Cleveland Street, Fitzrovia." />
    <!-- Figma type pairing: Instrument Serif (display), Poppins (body/UI), Cormorant Garamond (accent caps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <!-- Inter only sets the loader's "Fitzrovia · London" line: subset to those letters (~2 KB instead of ~47 KB) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&text=FITZROVIALNDfitzrovialnd%C2%B7%20&display=swap" rel="stylesheet">
    <!-- Blackletter for the Daily Mail wordmarks in "As Featured In"; subset to just those letters -->
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&text=DailyM&display=swap" rel="stylesheet">

    <!-- Intro loader: inlined so it paints before the app bundle arrives (lifted by src/motion/intro.js) -->
    <style>
      #ap-loader { position: fixed; inset: 0; z-index: 2000; display: grid; place-items: center; background: #121110; color: #F7F3EC; }
      #ap-loader::after { content: ""; position: absolute; top: 100%; left: -10%; right: -10%; height: 14vh; background: #121110; border-radius: 0 0 50% 50% / 0 0 100% 100%; }
      .ap-loader__inner { display: grid; justify-items: center; padding: 0 1.5rem; }
      .ap-loader__inner picture { display: contents; }
      .ap-loader__logo { height: clamp(40px, 8vw, 64px); width: auto; margin-bottom: 1.15rem; opacity: 0; animation: apLoaderFade 1s ease 0.3s forwards; }
      .ap-loader__mark { display: flex; overflow: hidden; padding: 0.12em 0 0.14em 0.26em; font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(1.05rem, 4.4vw, 2.9rem); font-weight: 500; line-height: 1.1; letter-spacing: 0.26em; white-space: nowrap; }
      .ap-loader__mark span { display: inline-block; white-space: pre; transform: translate3d(0, 115%, 0); }
      .ap-fonts .ap-loader__mark span { animation: apLoaderLetter 1.1s cubic-bezier(0.16, 1, 0.3, 1) calc(var(--i) * 55ms) forwards; }
      .ap-loader__rule { position: relative; width: min(16rem, 58vw); height: 1px; margin: 1.5rem 0 1.15rem; overflow: hidden; background: rgba(247, 243, 236, 0.14); }
      .ap-loader__rule span { position: absolute; inset: 0; background: #D6BD8A; transform: scaleX(0); transform-origin: left center; animation: apLoaderProgress 2.4s cubic-bezier(0.45, 0, 0.2, 1) 0.2s forwards; }
      .ap-loader__sub { padding-left: 0.34em; font-family: Inter, system-ui, sans-serif; font-size: 0.66rem; font-weight: 500; letter-spacing: 0.34em; text-transform: uppercase; color: #D6BD8A; opacity: 0; animation: apLoaderFade 1s ease 0.9s forwards; }
      #ap-loader.is-leaving { transform: translate3d(0, calc(-100% - 15vh), 0); transition: transform 1.25s cubic-bezier(0.76, 0, 0.24, 1) 0.4s; }
      #ap-loader.is-leaving .ap-loader__inner { opacity: 0; transform: translate3d(0, -2.5rem, 0); transition: opacity 0.55s ease, transform 0.9s cubic-bezier(0.76, 0, 0.24, 1); }
      #ap-loader.is-leaving .ap-loader__rule span { animation: apLoaderDone 0.4s ease-out forwards; }
      .ap-intro-quick .ap-loader__logo, .ap-intro-quick .ap-loader__mark span, .ap-intro-quick .ap-loader__sub { opacity: 1; transform: none; animation: none; }
      .ap-intro-quick .ap-loader__rule span { animation-duration: 0.35s; animation-delay: 0s; }
      .ap-intro-quick #ap-loader.is-leaving { opacity: 0; transform: none; transition: opacity 0.5s ease; }
      @keyframes apLoaderLetter { to { transform: translate3d(0, 0, 0); } }
      @keyframes apLoaderProgress { to { transform: scaleX(0.86); } }
      @keyframes apLoaderDone { from { transform: scaleX(0.86); } to { transform: scaleX(1); } }
      @keyframes apLoaderFade { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .ap-loader__logo, .ap-loader__mark span, .ap-loader__sub { opacity: 1; transform: none; animation: none !important; }
        .ap-loader__rule span { transform: scaleX(1); animation: none !important; }
        #ap-loader.is-leaving { opacity: 0; transform: none; transition: opacity 0.4s ease; }
      }
    </style>
    <noscript><style>#ap-loader { display: none; }</style></noscript>
    <script>
      (function () {
        var html = document.documentElement;
        window.__apIntroStart = performance.now();
        html.setAttribute('data-curtain', 'closed');
        try {
          if (sessionStorage.getItem('ap-intro-seen')) html.classList.add('ap-intro-quick');
        } catch (e) {}

        // Reveal the wordmark only once Cormorant is ready, so the letters never swap fonts mid-animation.
        var showWordmark = function () { html.classList.add('ap-fonts'); };
        if (document.fonts && document.fonts.load) {
          Promise.race([
            document.fonts.load('500 1em "Cormorant Garamond"'),
            new Promise(function (resolve) { setTimeout(resolve, 1200); })
          ]).then(showWordmark, showWordmark);
        } else {
          showWordmark();
        }

        // Failsafe: never leave the site covered if the app fails to start.
        setTimeout(function () {
          var loader = document.getElementById('ap-loader');
          if (loader && !loader.classList.contains('is-leaving')) {
            loader.remove();
            html.removeAttribute('data-curtain');
          }
        }, 9000);
      })();
    </script>
  </head>
  <body>
    <div id="ap-loader" aria-hidden="true">
      <div class="ap-loader__inner">
        <!-- Phones and tablets get a small copy of the 135 KB logo (it downloads alongside the app bundle) -->
        <picture>
          <source media="(max-width: 1279.98px)" type="image/avif" srcset="/assets/images/responsive/allure_logo-160.avif 160w, /assets/images/responsive/allure_logo-320.avif 320w" sizes="54px">
          <source media="(max-width: 1279.98px)" type="image/webp" srcset="/assets/images/responsive/allure_logo-160.webp 160w, /assets/images/responsive/allure_logo-320.webp 320w" sizes="54px">
          <img class="ap-loader__logo" src="/assets/images/allure_logo.png" alt="" />
        </picture>
        <div class="ap-loader__mark"><span style="--i:0">A</span><span style="--i:1">L</span><span style="--i:2">L</span><span style="--i:3">U</span><span style="--i:4">R</span><span style="--i:5">E</span><span style="--i:6"> </span><span style="--i:7">P</span><span style="--i:8">A</span><span style="--i:9">S</span><span style="--i:10">S</span><span style="--i:11">I</span><span style="--i:12">O</span><span style="--i:13">N</span><span style="--i:14">S</span><span style="--i:15"> </span><span style="--i:16">U</span><span style="--i:17">K</span></div>
        <div class="ap-loader__rule"><span></span></div>
        <div class="ap-loader__sub">Fitzrovia &middot; London</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
