<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF7F2" />
    <title>Allure Passions UK | Advanced Aesthetic Clinic in Fitzrovia, London</title>
    <meta name="description" content="Award-winning, practitioner-led aesthetic clinic in Fitzrovia, London, offering advanced non-invasive treatments for skin, body and wellbeing." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png" />

    <!-- The homepage hero poster is the largest paint; fetch it with the document. -->
    <link rel="preload" as="image" href="/assets/videos/hero-clinic-poster.webp" type="image/webp" fetchpriority="high" />

    <!-- Brief brand intro (first visit per session only). Pure CSS, so it never waits on the app. -->
    <style>
      html { background: #FAF7F2; }
      #ap-intro {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        background: #FAF7F2;
        animation: apIntroOut 300ms cubic-bezier(0.4, 0, 1, 1) 560ms forwards;
      }
      #ap-intro img {
        width: 52px;
        height: auto;
        opacity: 0;
        animation: apIntroIn 420ms cubic-bezier(0.2, 0, 0, 1) 60ms forwards;
      }
      .ap-intro-skip #ap-intro { display: none; }
      @keyframes apIntroIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes apIntroOut {
        to { opacity: 0; visibility: hidden; }
      }
      @media (prefers-reduced-motion: reduce) {
        #ap-intro { display: none; }
      }
    </style>
    <script>
      (function () {
        var html = document.documentElement;
        try {
          if (window.sessionStorage.getItem('ap-intro-seen')) {
            html.classList.add('ap-intro-skip');
          } else {
            window.sessionStorage.setItem('ap-intro-seen', '1');
          }
        } catch (error) {
          html.classList.add('ap-intro-skip');
        }
        window.setTimeout(function () {
          var intro = document.getElementById('ap-intro');
          if (intro) intro.remove();
        }, 1000);
      })();
    </script>
  </head>
  <body>
    <div id="ap-intro" aria-hidden="true">
      <img src="/assets/brand/ap-monogram.png" alt="" width="195" height="240" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
