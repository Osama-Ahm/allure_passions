<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ghpBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#24221E" />
      <stop offset="70%" stop-color="#141312" />
      <stop offset="100%" stop-color="#0B0B0A" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#AA7C28" />
      <stop offset="75%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#996E1E" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base & Borders -->
  <circle cx="200" cy="200" r="190" fill="url(#ghpBg)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="200" cy="200" r="182" fill="none" stroke="rgba(212, 175, 55, 0.35)" stroke-width="1" stroke-dasharray="4,3" />
  <circle cx="200" cy="200" r="156" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Laurel Wreath Left -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <path d="M108 280 C95 250, 95 200, 115 150 C118 165, 112 185, 105 195 C115 185, 125 180, 128 195 C118 210, 110 230, 108 280 Z" />
    <path d="M102 245 C88 235, 78 215, 82 195 C92 205, 95 220, 102 245 Z" />
    <path d="M108 210 C96 195, 88 175, 96 155 C104 168, 105 185, 108 210 Z" />
    <path d="M120 175 C110 155, 108 135, 118 118 C124 135, 122 152, 120 175 Z" />
    <path d="M138 145 C130 125, 132 105, 145 92 C148 108, 142 125, 138 145 Z" />
    <path d="M162 122 C156 102, 162 85, 176 75 C176 92, 168 108, 162 122 Z" />
  </g>

  <!-- Laurel Wreath Right -->
  <g fill="url(#goldGrad)" opacity="0.9" transform="translate(400, 0) scale(-1, 1)">
    <path d="M108 280 C95 250, 95 200, 115 150 C118 165, 112 185, 105 195 C115 185, 125 180, 128 195 C118 210, 110 230, 108 280 Z" />
    <path d="M102 245 C88 235, 78 215, 82 195 C92 205, 95 220, 102 245 Z" />
    <path d="M108 210 C96 195, 88 175, 96 155 C104 168, 105 185, 108 210 Z" />
    <path d="M120 175 C110 155, 108 135, 118 118 C124 135, 122 152, 120 175 Z" />
    <path d="M138 145 C130 125, 132 105, 145 92 C148 108, 142 125, 138 145 Z" />
    <path d="M162 122 C156 102, 162 85, 176 75 C176 92, 168 108, 162 122 Z" />
  </g>

  <!-- Top Star -->
  <polygon points="200,70 205,83 218,84 208,93 211,106 200,99 189,106 192,93 182,84 195,83" fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- ghp Logotype -->
  <text x="200" y="162" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="700" font-size="52" fill="#FFFFFF" letter-spacing="-1">ghp</text>
  
  <text x="200" y="180" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="500" font-size="10.5" fill="url(#goldGrad)" letter-spacing="3">GLOBAL HEALTH &amp; PHARMA</text>

  <!-- Divider Line -->
  <line x1="140" y1="194" x2="260" y2="194" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Award Details -->
  <text x="200" y="212" text-anchor="middle" font-family="'Trajan Pro', 'Cinzel', 'Georgia', serif" font-weight="600" font-size="11.5" fill="#FFFFFF" letter-spacing="2.5">GLOBAL EXCELLENCE</text>
  <text x="200" y="228" text-anchor="middle" font-family="'Trajan Pro', 'Cinzel', 'Georgia', serif" font-weight="600" font-size="11.5" fill="#FFFFFF" letter-spacing="2.5">AWARDS 2026</text>

  <!-- Winner Banner -->
  <rect x="135" y="242" width="130" height="24" rx="3" fill="url(#goldGrad)" />
  <text x="200" y="258" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="700" font-size="11" fill="#141312" letter-spacing="2">★ WINNER ★</text>

  <!-- Sub-citation -->
  <text x="200" y="286" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="400" font-size="9" fill="#E5D5AA" letter-spacing="1">BEST ADVANCED SKIN &amp; BODY CLINIC</text>
  <text x="200" y="300" text-anchor="middle" font-family="'Helvetica Neue', 'Arial', sans-serif" font-weight="600" font-size="9.5" fill="url(#goldGrad)" letter-spacing="1.5">CENTRAL LONDON</text>
</svg>
